name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate exam data
        run: python3 scripts/validate_data.py
      - name: Validate study notes and periods
        run: node scripts/validate_concepts.cjs
      - name: Validate core study curriculum
        run: python3 scripts/validate_study_guide.py
      - name: Validate all exam keywords
        run: python3 scripts/validate_keyword_guide.py
      - name: Validate king quiz
        run: python3 scripts/validate_king_quiz.py
      - name: Validate must-know selection
        run: python3 scripts/validate_must_know.py
      - name: Validate era question groups
        run: python3 scripts/validate_era_questions.py
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp eras.html eras.js eras.css index.html exam.html answers.html concepts.html keywords.html kings.html kings.js kings.css memorize.html memorize.js memorize.css styles.css app.js .nojekyll _site/
          cp -R assets _site/assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
